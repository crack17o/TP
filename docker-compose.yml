services:
  backend:
    build: ./backend
  # Remplacez VOTRE_USER par votre identifiant Docker Hub :
  # image: VOTRE_USER/todo-backend:latest
    container_name: todo-backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_PATH: /data/db.sqlite3
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    volumes:
      - todo-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
  # image: VOTRE_USER/todo-frontend:latest
    container_name: todo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  todo-data:
